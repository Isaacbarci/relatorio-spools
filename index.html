<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Relatório de Spools com Programação Não Iniciada</title>

  <style>
    *{box-sizing:border-box}
    body{
      font-family:Arial,Helvetica,sans-serif;
      margin:0;
      padding:12px;
      background:#f7f7f7;
    }

    h2{margin-top:0}

    .container{
      max-width:1200px;
      margin:auto;
      background:#fff;
      padding:12px;
      border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .top{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    button,input{
      padding:10px;
      font-size:14px;
    }

    input{
      flex:1;
      min-width:220px;
    }

    button{
      cursor:pointer;
      background:#1976d2;
      color:#fff;
      border:none;
      border-radius:4px;
    }

    button:hover{opacity:.9}

    .muted{
      font-size:12px;
      color:#555;
      width:100%;
    }

    .table-wrapper{
      width:100%;
      overflow-x:auto;
    }

    table{
      border-collapse:collapse;
      width:100%;
      min-width:800px;
    }

    th,td{
      border:1px solid #ddd;
      padding:8px;
      text-align:left;
      white-space:nowrap;
    }

    th{
      background:#f1f1f1;
      position:sticky;
      top:0;
      z-index:1;
    }

    tbody tr:nth-child(even){
      background:#fafafa;
    }

    tfoot th{
      background:#e9e9e9;
    }

    @media (max-width:600px){
      h2{
        font-size:18px;
      }

      button,input{
        width:100%;
      }

      table{
        font-size:13px;
      }
    }
  </style>
</head>

<body>
<div class="container">

<h2>Relatório de Spools com Programação Não Iniciada</h2>

<div class="top">
  <button id="btn">Atualizar</button>
  <input id="filtro" placeholder="Filtrar por Serviço, Local, Material ou Prog Fab">
  <div class="muted" id="status">Carregando...</div>
</div>

<div class="table-wrapper">
<table>
  <thead>
    <tr>
      <th>Serviço</th>
      <th>Local</th>
      <th>Material</th>
      <th>Prog Fab</th>
      <th>Qtd</th>
      <th>Peso</th>
    </tr>
  </thead>
  <tbody id="tb"></tbody>
  <tfoot>
    <tr>
      <th colspan="4">TOTAL (filtrado)</th>
      <th id="tq">0</th>
      <th id="tp">0,00</th>
    </tr>
  </tfoot>
</table>
</div>

</div>

<script>
  const SHEET_ID = "1lrBnjXYNDfqKMYpKBMrcSe1cI9PAOuo0q1KxkF1sUC8";
  const URL = `https://opensheet.elk.sh/${SHEET_ID}/DADOS`;

  let cache = [];

  function toNumberPtBR(v){
    if (v == null) return 0;
    if (typeof v === "number") return v;
    const s = String(v).trim().replace(/\./g,"").replace(",", ".");
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function fmtPeso(n){
    return (n ?? 0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function render(lista){
    const tb = document.getElementById("tb");
    tb.innerHTML = "";

    let totalQtd = 0;
    let totalPeso = 0;

    for(const row of lista){
      if ((row["SERVIÇO"] || "").toUpperCase() === "TOTAL GERAL") continue;

      const qtd = Number(row["QTD SPOOLS"] || 0);
      const peso = toNumberPtBR(row["PESO TOTAL"]);

      totalQtd += qtd;
      totalPeso += peso;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row["SERVIÇO"] || ""}</td>
        <td>${row["LOCAL FABRICAÇÃO"] || ""}</td>
        <td>${row["MATERIAL"] || ""}</td>
        <td>${row["PROG FAB"] || ""}</td>
        <td>${qtd}</td>
        <td>${fmtPeso(peso)}</td>
      `;
      tb.appendChild(tr);
    }

    document.getElementById("tq").textContent = totalQtd;
    document.getElementById("tp").textContent = fmtPeso(totalPeso);
  }

  function aplicarFiltro(){
    const q = document.getElementById("filtro").value.trim().toUpperCase();
    if(!q){ render(cache); return; }

    const filtrado = cache.filter(r => {
      const s = [
        r["SERVIÇO"],
        r["LOCAL FABRICAÇÃO"],
        r["MATERIAL"],
        r["PROG FAB"]
      ].join(" ").toUpperCase();
      return s.includes(q);
    });

    render(filtrado);
  }

  async function carregar(){
    const status = document.getElementById("status");
    status.textContent = "Atualizando...";

    const r = await fetch(URL,{cache:"no-store"});
    if(!r.ok){
      status.textContent = "Erro ao carregar (" + r.status + ")";
      return;
    }

    cache = await r.json();
    render(cache);

    status.textContent = "Atualizado em " + new Date().toLocaleString("pt-BR");
  }

  document.getElementById("btn").addEventListener("click", carregar);
  document.getElementById("filtro").addEventListener("input", aplicarFiltro);

  carregar();
</script>

</body>
</html>
